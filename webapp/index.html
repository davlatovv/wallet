    <title>Wallet</title>
    <!--
      No telegram-web-app.js here on purpose: @telegram-apps/sdk (see
      shared/telegram/init.ts) implements the bridge to Telegram itself and
      does its own environment detection. Loading the official script
      alongside it creates a stray `window.Telegram.WebApp` that confuses
      that detection — found by testing in this browser outside Telegram,
      where init() threw UnknownEnvError only when this tag was present.
    -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
